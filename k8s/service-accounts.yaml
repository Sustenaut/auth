# Nothing in this namespace talks to the Kubernetes API (Keycloak, its
# PostgreSQL, the realm job and the backup all reach only each other, GCS
# and SMTP), so the default account mounts no API token into any pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
automountServiceAccountToken: false
---
# The backup's own: Google lets it act as sustenaut-auth-backup through Workload Identity
# (Sustenaut/shared-infra's infra/services-identity.tf), by a projected token whose only
# audience is the services pool's provider, so it too gets no API token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup
automountServiceAccountToken: false
---
# PostgreSQL's own, for its WAL archive: Google lets it act as sustenaut-auth-wal through
# Workload Identity (Sustenaut/shared-infra's infra/services-identity.tf), by a projected
# token whose only audience is the services pool's provider, so it gets no API token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
automountServiceAccountToken: false
