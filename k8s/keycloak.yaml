# Keycloak with the wallet plugin and our providers (Dockerfile).
# One replica: caches are local (KC_CACHE=local) and sessions live in PostgreSQL.
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
---
# The admin console, reachable over the tailnet only: the node port is closed to
# the internet by the Hetzner firewall. Keycloak's admin console needs a secure
# browser context, so it is served as http://localhost:8180 through an SSH tunnel:
#   ssh -L 8180:127.0.0.1:30180 root@sustenaut   then open http://localhost:8180/admin/
apiVersion: v1
kind: Service
metadata:
  name: keycloak-admin
spec:
  type: NodePort
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      nodePort: 30180
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: ghcr.io/sustenaut/sustenaut-auth
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          env:
            - name: KC_DB_URL
              value: jdbc:postgresql://postgres:5432/keycloak
            - name: KC_DB_USERNAME
              value: keycloak
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: db-password
            - name: KC_HOSTNAME
              value: https://auth.sustenaut.eu
            # The admin console's own address: the SSH tunnel above.
            - name: KC_HOSTNAME_ADMIN
              value: http://localhost:8180
            # TLS ends at Traefik, which sets X-Forwarded-*.
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HTTP_ENABLED
              value: "true"
            # The first master-realm admin, and the client the realm job signs in
            # with; Keycloak creates both only while the master realm has no admin.
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: admin-password
            - name: KC_BOOTSTRAP_ADMIN_CLIENT_ID
              value: sustenaut-config
            - name: KC_BOOTSTRAP_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: config-client-secret
            # The key of the team realm's access-state hash; the deploy walk makes it.
            # Optional so a deploy before that still starts (the endpoint answers 503).
            - name: SUSTENAUT_ACCESS_HASH_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: access-hash-key
                  optional: true
            # The key that signs member credentials; the entrypoint writes it where
            # the realm's java-keystore key provider reads it.
            - name: SUSTENAUT_ISSUER_KEYSTORE_B64
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: issuer-keystore
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 1536Mi
