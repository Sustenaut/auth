# Nightly dump of Keycloak's database to the Google Cloud Storage bucket
# sustenaut-auth-backups (infra/main.tf: in Finland, kept 30 days, written by an
# account that can only create objects, reached with no key through Workload Identity:
# google-credential.yaml). Restore: README.md.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
spec:
  schedule: "17 2 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: backup
          automountServiceAccountToken: false
          volumes:
            - name: dump
              emptyDir: {}
            - name: google-token
              projected:
                sources:
                  - serviceAccountToken:
                      audience: "//iam.googleapis.com/projects/948171295184/locations/global/workloadIdentityPools/services/providers/sustenaut-k3s"
                      path: token
                      expirationSeconds: 3600
            - name: google-credential
              configMap:
                name: google-credential
          initContainers:
            - name: dump
              image: docker.io/library/postgres:16.14
              command:
                - sh
                - -c
                - pg_dump -h postgres -U keycloak -d keycloak -Fc -f "/dump/keycloak-$(date -u +%Y%m%dT%H%M%SZ).dump"
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: auth-secrets
                      key: db-password
              volumeMounts:
                - name: dump
                  mountPath: /dump
          containers:
            - name: upload
              image: gcr.io/google.com/cloudsdktool/google-cloud-cli:587.0.0-slim
              command:
                - sh
                - -c
                - gcloud storage cp /dump/*.dump gs://sustenaut-auth-backups/
              env:
                - name: CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE
                  value: /etc/google/credential.json
                - name: CLOUDSDK_CORE_DISABLE_USAGE_REPORTING
                  value: "true"
              volumeMounts:
                - name: dump
                  mountPath: /dump
                - name: google-token
                  mountPath: /var/run/secrets/google
                  readOnly: true
                - name: google-credential
                  mountPath: /etc/google
                  readOnly: true
              resources:
                limits:
                  memory: 512Mi
