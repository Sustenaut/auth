# Family sign-in (realm family): an email field; an email with a sign-in link and a code
# (a passkey, if set up, offered in the field). No passwords, no registration. Separate from themes/sustenaut (wallet only).
parent=keycloak.v2
import=common/keycloak
# keycloak.v2's stylesheet, then the Sustenaut look over it (resources/css/sustenaut.css).
styles=css/styles.css css/sustenaut.css
