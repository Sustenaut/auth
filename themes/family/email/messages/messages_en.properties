# Invitations and sign-in emails (a link and a code). With a registered domain's settings
# (TenantEmail), its name, words and home page; without (invite-family.sh, the admin
# fallback), neutral wording.
executeActionsSubject=Your invitation to sign in
familyInviteSubject=Your invitation from {0}
familyInviteIntroDefault={0} has invited you.
familyInviteIntroNeutral=You have been invited to sign in with {0}.
familyInviteBody={0}\n\nOpen the link below to sign in. There is no password and nothing to set up.\n\n{1}\n\nThe link works once, for {2}. Later, sign in at {3} with your email address: we send you a link that signs you in.\n\nIf you did not expect this email, you can ignore it.
familyInviteBodyHtml=<p>{0}</p><p>Open the link below to sign in. There is no password and nothing to set up.</p><p><a href="{1}" style="display:inline-block;padding:0.6em 1.2em;background:#0066cc;color:#ffffff;text-decoration:none;border-radius:4px;">Sign me in</a></p><p>The link works once, for {2}. Later, sign in at {3} with your email address: we send you a link that signs you in.</p><p>If you did not expect this email, you can ignore it.</p>
familyInviteWhere=the site that invited you
familyCodeSubject=Your sign-in link
familyCodeSubjectFor=Your sign-in link for {0}
requiredAction.webauthn-register-passwordless=set up a passkey
requiredAction.family-invite-sign-in=sign in
familyCodeBody=To sign in to {1}, open this link on the device where you asked for it:\n\n{3}\n\nReading this somewhere else? Type this code on the screen where you started:\n\n{0}\n\nThe link and the code work for {2} minutes, once. If you did not ask for them, you can ignore this email.
familyCodeBodyHtml=<p>To sign in to {1}:</p><p><a href="{3}" style="display:inline-block;padding:0.6em 1.2em;background:#0066cc;color:#ffffff;text-decoration:none;border-radius:4px;">Sign me in</a></p><p>Reading this on another device? Type this code on the screen where you started:</p><p style="font-size:1.6em;letter-spacing:0.2em;"><strong>{0}</strong></p><p>The link and the code work for {2} minutes, once. If you did not ask for them, you can ignore this email.</p>
# A passkey added after the first one (PasskeyNotice). {0} name, {1} email, {2} readable time,
# {3} UTC timestamp, {4} device, {5} whom to contact.
familyPasskeySubject=A new passkey was added to your account
familyPasskeySubjectFor=A new passkey for {0}
familyPasskeyContactDefault=the people who run {0}
familyPasskeyContactNeutral=the person who invited you
familyPasskeyBody=A new passkey was added to your account for {0} ({1}).\n\nWhen: {2} ({3})\nDevice: {4}\n\nIf this was you, there is nothing to do.\n\nIf it was not you, contact {5} straight away: someone else may be able to sign in as you.
familyPasskeyBodyHtml=<p>A new passkey was added to your account for {0} ({1}).</p><p>When: {2} ({3})<br>Device: {4}</p><p>If this was you, there is nothing to do.</p><p><strong>If it was not you, contact {5} straight away:</strong> someone else may be able to sign in as you.</p>
# Access ends (FamilyRemoval), in the domain's words: {0} its name, {1} who to ask.
familyRemovedSubject=Your access to {0}
familyRemoved_removed=You no longer have access to {0}.
familyRemoved_moved=You no longer have access to {0}: what {0} shares with you has moved to a new address. Questions? Ask {1}.
familyRemoved_left=You no longer have access to {0}: you asked to remove it.
familyRemoved_gone=You no longer have access to {0}: {0} no longer uses this sign-in.
familyRemovedDeleted=Your sign-in account is switched off and will be deleted in {0} days. If you are invited again before then, it comes back as it was.
