executeActionsSubject=Your invitation to sign in to Sustenaut''s team sites
familyInviteIntroNeutral=You have been invited to Sustenaut''s team sites (such as opportunity.sustenaut.eu).
familyInviteWhere=opportunity.sustenaut.eu
# The team's invitation sets up a passkey (invite-team.sh: webauthn-register-passwordless),
# unlike the family's, which signs in.
familyInviteBody={0}\n\nOpen the link below to set up a passkey: your phone or computer will ask for your fingerprint, face, screen lock or PIN, and that is all. There is no password.\n\n{1}\n\nThe link works for {2}. Later, sign in at {3} with the passkey, or ask for a sign-in link by email.\n\nIf you did not expect this email, you can ignore it.
familyInviteBodyHtml=<p>{0}</p><p>Open the link below to set up a passkey: your phone or computer will ask for your fingerprint, face, screen lock or PIN, and that is all. There is no password.</p><p><a href="{1}">Set up my passkey</a></p><p>The link works for {2}. Later, sign in at {3} with the passkey, or ask for a sign-in link by email.</p><p>If you did not expect this email, you can ignore it.</p>
