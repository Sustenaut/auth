# Build and deploy the shared sign-in (auth.sustenaut.eu) on each merge to main. Two images go to GitHub's container registry:
# Keycloak with the wallet plugin and our providers, and the realm as code
# (keycloak-config-cli). Then the manifests in k8s/, rendered with
# those images, go to the Sustenaut k3s server (shared-infra's infra/hetzner.tf) over SSH, where
# the deploy key can only run sustenaut-deploy: apply in namespace auth, re-run
# the realm job, wait for both, once DEPLOY_AUTH is on, which the deploy walk
# (`./pubdeploy walk --fulfil`, README.md, "Deploying") sets once every need before it
# is ready. SSH is reachable over Sustenaut's tailnet only, so the job joins it first, as
# tag:ci (Tailscale's GitHub Action, OAuth client).
#
# Needs (README.md, "Deploying"):
#   secret   SUSTENAUT_DEPLOY_SSH_KEY   terraform output -raw sustenaut_deploy_ssh_key (shared-infra's infra)
#   secrets  TS_GH_OAUTH_CLIENT_ID, TS_GH_OAUTH_SECRET   the Tailscale OAuth client for CI
#   variable SUSTENAUT_SERVER           the server's tailnet name, sustenaut
#   variable SUSTENAUT_KNOWN_HOSTS      the server's known_hosts line
#   variable FAMILY_TENANT_DOMAIN       the domain the family realm lets register for sign-in
#                                       (beside sustenaut.eu); the realm job reads it from auth-deploy
#   variable DEPLOY_AUTH                on, set by the deploy walk
# Without SUSTENAUT_SERVER, or with DEPLOY_AUTH not on, the images are built and pushed, and
# nothing is deployed.
name: auth

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: auth
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/sustenaut/sustenaut-auth
  REALM_IMAGE: ghcr.io/sustenaut/sustenaut-auth-realm

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        uses: Sustenaut/pubkit/actions/docker-build@74ab84e90fc8b6f691ef4b3d717a9e838d49e4a8 # v0.34.0
        with:
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          scope: auth
      - name: Build the realm image
        uses: Sustenaut/pubkit/actions/docker-build@74ab84e90fc8b6f691ef4b3d717a9e838d49e4a8 # v0.34.0
        with:
          tags: ${{ env.REALM_IMAGE }}:${{ github.sha }}
          scope: auth-realm
          context: realm

      # The image must hold the patched plugin, our providers and the theme.
      - name: Check the image
        run: |
          docker run --rm --entrypoint sh "${IMAGE}:${GITHUB_SHA}" -c '
            ls /opt/keycloak/providers/oid4vp-plugin.jar /opt/keycloak/providers/sustenaut-keycloak.jar &&
            ls /opt/keycloak/themes/sustenaut/login/login-default.ftl &&
            ls /opt/keycloak/themes/sustenaut/login/resources/plugin-source/README.txt &&
            ls /opt/keycloak/bin/sustenaut-entrypoint.sh'

      - name: Push the images
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${REALM_IMAGE}:${GITHUB_SHA}"

      # The server pulls these without a token, so each must be public. A package's first push
      # makes it private, which would leave its pod unable to start (on 2026-11-06 that stopped
      # sign-in for twelve minutes). Asked as the server asks, signed out, before anything deploys.
      - name: Check the server can pull the images
        run: |
          docker logout ghcr.io
          failed=0
          for image in "${IMAGE}" "${REALM_IMAGE}"; do
            if ! docker manifest inspect "${image}:${GITHUB_SHA}" >/dev/null 2>&1; then
              echo "::error::${image} can't be pulled without a token: make the package public (github.com/orgs/Sustenaut/packages, ${image##*/}, Package settings, Change visibility), then run this workflow again."
              failed=1
            fi
          done
          exit "$failed"

      - name: Render the manifests
        working-directory: k8s
        env:
          FAMILY_TENANT_DOMAIN: ${{ vars.FAMILY_TENANT_DOMAIN }}
        run: |
          if [[ ! "${FAMILY_TENANT_DOMAIN}" =~ ^([a-z0-9-]+\.)+[a-z]{2,}$ ]]; then
            echo "::error::Set the Actions variable FAMILY_TENANT_DOMAIN to the family realm's tenant domain (README, Deploying)."
            exit 1
          fi
          kustomize edit add configmap auth-deploy --from-literal="FAMILY_TENANT_DOMAIN=${FAMILY_TENANT_DOMAIN}"
          kustomize edit set image "${IMAGE}=${IMAGE}:${GITHUB_SHA}" "${REALM_IMAGE}=${REALM_IMAGE}:${GITHUB_SHA}"
          kustomize build . > "${RUNNER_TEMP}/auth.yaml"
          grep -q "${IMAGE}:${GITHUB_SHA}" "${RUNNER_TEMP}/auth.yaml"

      - name: Join Sustenaut's tailnet
        if: vars.SUSTENAUT_SERVER != '' && vars.DEPLOY_AUTH == 'on'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_GH_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_GH_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy to the k3s server
        if: vars.SUSTENAUT_SERVER != '' && vars.DEPLOY_AUTH == 'on'
        env:
          DEPLOY_KEY: ${{ secrets.SUSTENAUT_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.SUSTENAUT_KNOWN_HOSTS }}
          SERVER: ${{ vars.SUSTENAUT_SERVER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes "deploy@${SERVER}" auth < "${RUNNER_TEMP}/auth.yaml"
