# Fail when this repository's calls to outside services and its
# integrations.json disagree: https://github.com/Sustenaut/integrations
name: integrations

on:
  pull_request:
  merge_group:
  push: { branches: [main] }

permissions:
  contents: read

jobs:
  integrations:
    uses: Sustenaut/integrations/.github/workflows/scan.yml@de343d7b9f0f5c186eb77b409857b4b5f3c1f4c0 # v0.16.0
