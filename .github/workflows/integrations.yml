# Fail when this repository's calls to outside services and its
# integrations.json disagree: https://github.com/Sustenaut/integrations
name: integrations

on:
  pull_request:
  merge_group:
  push: { branches: [main] }

permissions:
  contents: read

jobs:
  integrations:
    uses: Sustenaut/integrations/.github/workflows/scan.yml@dc08487220b2e6ea18cdf2e242240f61d25e69ad # v0.15.1
