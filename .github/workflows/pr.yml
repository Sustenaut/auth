# Written by `pubkit sync` from the ci block of pubkit.json. Do not edit:
# change pubkit.json and run `pubkit sync`.
name: pr

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  checks:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-service-checks.yml@10b9de8d505ab41bf00fdcc6c014c12855ef6a5e # v0.31.1
    with: {"shellcheck": "with-secrets *.sh scripts/*.sh backups/pg-backup"}

  terraform:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-service-terraform.yml@10b9de8d505ab41bf00fdcc6c014c12855ef6a5e # v0.31.1
    with: {"terraform-dir": "infra"}

  sonar:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-sonar.yml@10b9de8d505ab41bf00fdcc6c014c12855ef6a5e # v0.31.1
    with: {"reports": "sonar.python.coverage.reportPaths=*.xml sonar.javascript.lcov.reportPaths=lcov.info"}
    secrets: { SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}' }

  # The one check a ruleset requires: it passes only when every job
  # above succeeded. None of them is ever skipped for not being asked for.
  passed:
    name: ci / passed
    if: always()
    needs: [checks, terraform, sonar]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
        env: { RESULTS: '${{ toJSON(needs) }}' }
